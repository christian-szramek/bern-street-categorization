services:
  postgis:
    image: postgis/postgis:18-3.6
    container_name: postgis
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    ports:
      - ${PG_PORT}:5432
    volumes:
      - postgis:/var/lib/postgresql
      - ./docker/postgis/initdb:/docker-entrypoint-initdb.d
  pg_tileserv:
    image: pramsey/pg_tileserv:20250131
    container_name: pg_tileserv
    depends_on:
      - postgis
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql://${PG_USER}:${PGPASSWORD}@postgis/${PG_DB}
    ports:
      - ${PG_TILESERV_PORT}:7800
    volumes:
      - ./docker/pg_tileserv_config:/config
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - ${FRONTEND_PORT}:80
    depends_on:
      - pg_tileserv
    restart: unless-stopped
volumes:
  postgis:
